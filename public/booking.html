<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSF Clinic - Book Appointment</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #004080; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        .slots-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .slot-btn { padding: 10px 15px; border: 1px solid #007bff; background: #fff; color: #007bff; border-radius: 5px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .slot-btn:hover { background: #007bff; color: #fff; }
        .slot-btn.selected { background: #28a745; color: #fff; border-color: #28a745; }
        .error-msg { color: red; font-weight: bold; margin-top: 5px; font-size: 14px; }
        .payment-box { background: #eef9ff; border: 1px dashed #007bff; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .submit-btn { background: #28a745; color: white; border: none; padding: 12px; width: 100%; font-size: 18px; border-radius: 5px; cursor: pointer; }
        .submit-btn:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>🧠 NSF Clinic</h2>
    <div class="subtitle">Psychological Medicine & Neuro Psychiatry - Prof. Dr. Shakil Jehangir Malik</div>
    
    <form id="bookingForm" onsubmit="submitAppointment(event)">
        
        <div class="form-group">
            <label>Doctor *</label>
            <select id="doctorSelect" disabled>
                <option value="doc-shakil">Prof. Dr. Shakil Jehangir Malik</option>
            </select>
        </div>

        <div class="form-group">
            <label>Appointment Type *</label>
            <select id="appointmentType" onchange="updateFeeDetails()" required>
                <option value="Initial">Initial Consultation (12,000 PKR - 60 Mins)</option>
                <option value="Follow-up">Follow-up Consultation (8,000 PKR - 30 Mins)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Patient Name *</label>
            <input type="text" id="patientName" required placeholder="Enter full name">
        </div>

        <div class="form-group">
            <label>Phone Number *</label>
            <input type="text" id="phoneNumber" required placeholder="03XXXXXXXXX">
        </div>

        <div class="form-group">
            <label>Age *</label>
            <input type="number" id="age" required placeholder="Enter age">
        </div>

        <div class="form-group">
            <label>Select Date * (Only Tuesday & Saturday)</label>
            <input type="date" id="selectDate" onchange="handleDateChange()" required>
            <div id="availabilityMessage" class="error-msg"></div>
        </div>

        <div class="form-group">
            <label>Select Time Slot *</label>
            <div id="timeSlotsContainer" class="slots-container"></div>
            <input type="hidden" id="selectedSlotInput" required>
        </div>

        <!-- EasyPaisa / JazzCash Payment Information Box -->
        <div class="payment-box">
            <label style="color: #004080; margin-bottom: 5px;">💳 Online Advance Payment (EasyPaisa / JazzCash)</label>
            <p style="margin: 0; font-size: 14px; color: #444;">
                Appointment confirm karne ke liye <strong>20% Advance Payment</strong> lazmi hai.<br>
                Total Fee: <span id="totalFeeText">12,000</span> PKR | <strong>Advance Required (20%): <span id="advanceFeeText" style="color: #d9534f;">2,400</span> PKR</strong>
            </p>
            <div style="margin-top: 10px;">
                <label style="font-size: 13px; font-weight: normal;">Select Gateway:</label>
                <select id="paymentGateway" style="padding: 6px;">
                    <option value="EasyPaisa">EasyPaisa Account Transfer</option>
                    <option value="JazzCash">JazzCash Mobile Account</option>
                </select>
            </div>
        </div>

        <button type="submit" class="submit-btn">Pay Advance & Confirm Appointment</button>
    </form>
</div>

<script>
    function updateFeeDetails() {
        const typeVal = document.getElementById('appointmentType').value;
        const total = typeVal === 'Initial' ? 12000 : 8000;
        const advance = total * 0.20;
        document.getElementById('totalFeeText').innerText = total.toLocaleString();
        document.getElementById('advanceFeeText').innerText = advance.toLocaleString();
        generateTimeSlots();
    }

    function handleDateChange() {
        const dateInput = document.getElementById('selectDate');
        const msgElement = document.getElementById('availabilityMessage');
        const slotsContainer = document.getElementById('timeSlotsContainer');
        
        if (!dateInput || !dateInput.value) return;
        
        const selectedDate = new Date(dateInput.value);
        const dayOfWeek = selectedDate.getDay(); // 2 = Tuesday, 6 = Saturday
        
        if (dayOfWeek !== 2 && dayOfWeek !== 6) {
            msgElement.innerText = "Doctor sirf Tuesday aur Saturday ko available hain.";
            if (slotsContainer) slotsContainer.innerHTML = ''; 
            return;
        }
        
        msgElement.innerText = "";
        generateTimeSlots();
    }

    function generateTimeSlots() {
        const dateInput = document.getElementById('selectDate');
        if (!dateInput || !dateInput.value) return;
        
        const selectedDate = new Date(dateInput.value);
        const dayOfWeek = selectedDate.getDay();
        if (dayOfWeek !== 2 && dayOfWeek !== 6) return;

        const appointmentTypeSelect = document.getElementById('appointmentType');
        const isInitial = appointmentTypeSelect && appointmentTypeSelect.value === 'Initial';
        const slotDuration = isInitial ? 60 : 30; 
        
        const startHour = 11;
        const endHour = 18; 
        
        let currentTime = startHour * 60;
        const endTime = endHour * 60;
        
        const slotsContainer = document.getElementById('timeSlotsContainer');
        if (!slotsContainer) return;
        slotsContainer.innerHTML = ''; 
        
        while (currentTime < endTime) {
            if (currentTime >= 750 && currentTime < 780) {
                currentTime = 780;
                continue;
            }

            let nextTime = currentTime + slotDuration;
            if (slotDuration === 60 && currentTime === 720) { nextTime = 750; }

            let slotStartHour = Math.floor(currentTime / 60);
            let slotStartMin = currentTime % 60;
            let slotEndHour = Math.floor(nextTime / 60);
            let slotEndMin = nextTime % 60;
            
            let startTimeFormatted = formatTimeToAMPM(slotStartHour, slotStartMin);
            let endTimeFormatted = formatTimeToAMPM(slotEndHour, slotEndMin);
            
            let slotButton = document.createElement('button');
            slotButton.type = 'button';
            slotButton.className = 'slot-btn';
            slotButton.innerText = `${startTimeFormatted} - ${endTimeFormatted}`;
            
            slotButton.onclick = function() {
                document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
                slotButton.classList.add('selected');
                document.getElementById('selectedSlotInput').value = slotButton.innerText;
            };
            
            slotsContainer.appendChild(slotButton);
            currentTime = nextTime;
        }
    }

    function formatTimeToAMPM(hour, min) {
        let ampm = hour >= 12 ? 'PM' : 'AM';
        let formattedHour = hour % 12;
        formattedHour = formattedHour ? formattedHour : 12;
        let formattedMin = min < 10 ? '0' + min : min;
        return `${formattedHour}:${formattedMin} ${ampm}`;
    }

    function submitAppointment(event) {
        event.preventDefault();
        
        const typeVal = document.getElementById('appointmentType').value;
        const feeVal = typeVal === 'Initial' ? 12000 : 8000; 

        const bookingData = {
            clinicId: 'professorial-clinic',
            doctorId: 'doc-shakil',
            type: typeVal,
            fee: feeVal,
            name: document.getElementById('patientName').value,
            phone: document.getElementById('phoneNumber').value,
            age: document.getElementById('age').value,
            date: document.getElementById('selectDate').value,
            time: document.getElementById('selectedSlotInput').value,
            paymentMethod: document.getElementById('paymentGateway').value
        };

        fetch('/api/appointments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bookingData)
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert('Advance Payment Received via EasyPaisa/JazzCash!\nAppointment Confirmed. Number: ' + data.appointment.id);
                window.location.reload();
            } else {
                alert('Error: ' + (data.message || 'Kuch galat ho gaya hai'));
            }
        })
        .catch(err => {
            console.error('Error:', err);
            alert('Server error during booking.');
        });
    }
</script>

</body>
</html>
