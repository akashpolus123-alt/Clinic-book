<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Appointment - NSF Clinic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">NSF</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="track-booking.html" class="active">Track Appt</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <!-- Hero Banner -->
    <section class="hero" style="padding: 25px 5%;">
        <h1 style="font-size: 24px;">Track Your Appointment</h1>
        <p class="subtitle" style="font-size: 14px; margin-top: 4px;">Enter your Booking ID or Phone Number to check status</p>
    </section>

    <!-- Main Content -->
    <main style="margin-top: 20px;">
        <div class="form-card">
            <h2 style="font-size: 18px; margin-bottom: 15px;">Appointment Status Search</h2>
            
            <div class="form-group">
                <label>Booking ID or Phone Number</label>
                <input type="text" id="searchQuery" placeholder="e.g., APT-172485 or 03XXXXXXXXX">
            </div>

            <button type="button" onclick="trackBooking()" style="width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">Search Status</button>
            
            <div id="resultBox" style="margin-top: 20px;"></div>
        </div>
    </main>

    <!-- Professional Footer -->
    <footer style="text-align: center; padding: 20px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border-color); margin-top: 40px;">
        &copy; 2026 NSF Clinic (Prof. Dr. Shakil Jehangir Malik). All rights reserved.
    </footer>

    <script>
        function trackBooking() {
            const query = document.getElementById('searchQuery').value.trim();
            const box = document.getElementById('resultBox');

            if (!query) {
                box.innerHTML = <p style="color: #dc2626; font-size: 13px; text-align: center;">Please enter a valid Booking ID or Phone Number.</p>;
                return;
            }

            box.innerHTML = <p style="color: #0369a1; font-size: 13px; text-align: center;">Searching appointment records...</p>;

            // Simulated lookup or connect with backend API if needed
            setTimeout(() => {
                box.innerHTML = `
                    <div style="background: #f0fdf4; border: 1px solid #bbf7d0; padding: 15px; border-radius: 8px; font-size: 13px; color: #166534;">
                        <strong>Status: Pending Verification</strong><br>
                        Booking ID: ${query}<br>
                        Advance Payment TID submitted. Clinic will verify and confirm shortly.
                    </div>
                `;
            }, 600);
        }
    </script>
</body>
</html>
