<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Appointment - NSF Pakistan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo" style="color: var(--primary); font-weight: 800; font-size: 20px;">NSF Pakistan</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="track-booking.html" class="active">Track Appt</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Track Your Appointment</h1>
        <p class="subtitle">Enter your Booking ID or Phone Number to check status</p>
    </section>

    <!-- Main Container -->
    <main>
        <div class="form-card">
            <h2>Search Booking Status</h2>
            <div class="form-group">
                <label>Booking ID or Phone Number</label>
                <input type="text" id="searchQuery" placeholder="e.g., APT-1728... or 03XXXXXXXXX" autocomplete="off">
            </div>
            <button type="button" class="btn-search" onclick="trackBooking()">Search Status</button>
            <div id="resultBox"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        &copy; 2026 NSF Pakistan (Prof. Dr. Shakil Jehangir Malik). All rights reserved.
    </footer>

    <script>
        async function trackBooking() {
            const query = document.getElementById('searchQuery').value.trim();
            const box = document.getElementById('resultBox');
            
            if (!query) {
                box.innerHTML = '<div class="error-card" style="margin-top: 15px;">Baraye meharbani apni Booking ID ya Phone number darj karein.</div>';
                return;
            }

            box.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 15px;">Searching record...</p>';

            try {
                const response = await fetch('/api/track?query=' + encodeURIComponent(query));
                const data = await response.json();

                if (data.success && data.appointment) {
                    const appt = data.appointment;
                    let badgeClass = appt.status === 'Completed' ? 'badge-completed' : (appt.status === 'Cancelled' ? 'badge-cancelled' : 'badge-pending');
                    let cancelBtnHTML = appt.status === 'Pending' ? `<br><button class="btn-cancel" onclick="cancelAppointment('${appt.id}')">Cancel Appointment</button>` : '';

                    box.innerHTML = `<div class="result-card" style="margin-top: 15px;">
                        <div style="font-size: 16px; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #bbf7d0; padding-bottom: 6px;">
                            Status: <span class="badge ${badgeClass}">${appt.status}</span>
                        </div>
                        <strong>Booking ID:</strong> ${appt.id}<br>
                        <strong>Patient Name:</strong> ${appt.name}<br>
                        <strong>Phone:</strong> ${appt.phone}<br>
                        <strong>Date & Time:</strong> ${appt.date} (${appt.time})<br>
                        <strong>Consultation Type:</strong> ${appt.type || 'Initial'}<br>
                        <strong>Total Fee:</strong> PKR ${appt.fee} (Advance Paid: PKR ${appt.advancePaid})<br>
                        ${cancelBtnHTML}
                    </div>`;
                } else {
                    box.innerHTML = '<div class="error-card" style="margin-top: 15px;">Koi appointment ya record nahi mila is query ke khilaaf.</div>';
                }
            } catch (error) {
                box.innerHTML = '<div class="error-card" style="margin-top: 15px;">Server se rabta karne mein masla hua. Dobara koshish karein.</div>';
            }
        }

        async function cancelAppointment(id) {
            if (!confirm("Kya aap waqai apni yeh appointment cancel karna chahte hain?")) return;
            
            try {
                const res = await fetch(`/api/appointments/cancel/${id}`, { method: 'PUT' });
                const result = await res.json();
                alert(result.message || "Appointment cancel ho chuki hai.");
                trackBooking();
            } catch (err) {
                alert("Appointment cancel karne mein error aaya.");
            }
        }
    </script>
</body>
</html>
