<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Appointment - NSF Clinic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">NSF</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="track-booking.html" class="active">Track Appt</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <!-- Hero Banner -->
    <section class="hero" style="padding: 25px 5%;">
        <h1 style="font-size: 24px;">Track Your Appointment</h1>
        <p class="subtitle" style="font-size: 14px; margin-top: 4px;">Enter your Booking ID or Phone Number to check status</p>
    </section>

    <!-- Main Content -->
    <main style="margin-top: 20px;">
        <div class="form-card">
            <h2 style="font-size: 18px; margin-bottom: 15px;">Appointment Status Search</h2>
            
            <div class="form-group">
                <label>Booking ID or Phone Number</label>
                <input type="text" id="searchQuery" placeholder="e.g., APT-172485 or 03XXXXXXXXX">
            </div>

            <button type="button" onclick="trackBooking()" style="width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">Search Status</button>
            
            <div id="resultBox" style="margin-top: 20px;"></div>
        </div>
    </main>

    <!-- Professional Footer -->
    <footer style="text-align: center; padding: 20px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border-color); margin-top: 40px;">
        &copy; 2026 NSF Clinic (Prof. Dr. Shakil Jehangir Malik). All rights reserved.
    </footer>

    <script>
        async function trackBooking() {
            const query = document.getElementById('searchQuery').value.trim();
            const box = document.getElementById('resultBox');

            if (!query) {
                box.innerHTML = '<p style="color: #dc2626; font-size: 13px; text-align: center;">Please enter a valid Booking ID or Phone Number.</p>';
                return;
            }

            box.innerHTML = '<p style="color: #0369a1; font-size: 13px; text-align: center;">Searching appointment records...</p>';

            try {
                const response = await fetch(`/api/track?query=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.success && data.appointment) {
                    const appt = data.appointment;
                    
                    let statusColor = '#166534';
                    let bgCol = '#f0fdf4';
                    let borderCol = '#bbf7d0';
                    
                    if (appt.status === 'Pending') {
                        statusColor = '#854d0e';
                        bgCol = '#fefce8';
                        borderCol = '#fef08a';
                    } else if (appt.status === 'Cancelled') {
                        statusColor = '#991b1b';
                        bgCol = '#fef2f2';
                        borderCol = '#fecaca';
                    }

                    box.innerHTML = `
                        <div style="background: ${bgCol}; border: 1px solid ${borderCol}; padding: 15px; border-radius: 8px; font-size: 13px; color: ${statusColor};">
                            <strong>Status: ${appt.status}</strong><br>
                            <strong>Booking ID:</strong> ${appt.id}<br>
                            <strong>Patient Name:</strong> ${appt.name}<br>
                            <strong>Phone:</strong> ${appt.phone}<br>
                            <strong>Date & Time:</strong> ${appt.date} (${appt.time})<br>
                            <strong>Consultation Type:</strong> ${appt.type}<br>
                            <strong>Fee:</strong> ${appt.fee} PKR (Advance Paid: ${appt.advancePaid} PKR)
                        </div>
                    `;
                } else {
                    box.innerHTML = <p style="color: #dc2626; font-size: 13px; text-align: center;">${data.message || 'No appointment found with this ID or phone number.'}</p>;
                }
            } catch (error) {
                box.innerHTML = '<p style="color: #dc2626; font-size: 13px; text-align: center;">Server error occurred while searching. Please try again.</p>';
            }
        }
    </script>
</body>
</html>
